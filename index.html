<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    


<div id="device">

    <div id="controls">

        <div id="themeSelector">

            <button id="themeLeft" class="themeButton">&#9664;</button>

            <div id="themeName">
                Explorer
            </div>

            <button id="themeRight" class="themeButton">&#9654;</button>

        </div>

        <button id="calibrateDestination">
            Calibrate
        </button>

    </div>

    <div id="displayScreen">

        <div id="worldDiv" class="data hidden">
            <div class="label">WORLD</div>
            <div id="worldName" class="value placeholder">Scanning...</div>
        </div>
        <div id="regionDiv" class="data hidden">
            <div class="label">REGION</div>
            <div id="regionName" class="value placeholder">Triangulating...</div>
        </div>
        <div id="zoneDiv" class="data hidden">
            <div class="label">ZONE</div>
            <div id="zoneName" class="value placeholder">Identifying...</div>
        </div>
        <div id="coordsDiv" class="data hidden">
            <div class="label">COORDINATES</div>
            <div id="coordsValue" class="value placeholder">Calculating...</div>
        </div>

    </div>
</div>

</body>
<script src="script.js"></script>
</html>
